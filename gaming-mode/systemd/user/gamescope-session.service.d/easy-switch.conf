[Service]
# Which screen Gaming Mode uses; written by easy-switch (OUTPUT_CONNECTOR=...)
EnvironmentFile=-%h/.config/easy-switch/gamescope.env
# gaming.conf sets MANGOHUD=1 for the desktop; in Gaming Mode Steam's own
# overlay (mangoapp) handles it, so don't also inject the MangoHud layer
Environment=MANGOHUD=0
# Where to log in next once Gaming Mode ends (reboot keeps Gaming Mode,
# crash/quit goes to Plasma) -- see ~/.local/bin/gaming-mode-stopped
ExecStopPost=-@HOME@/.local/bin/gaming-mode-stopped
