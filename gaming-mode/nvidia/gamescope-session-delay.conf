[Service]
# NVIDIA TV testing: wait before gamescope takes the screen, so the HDMI link
# from the previous session (Plasma / last Gaming Mode) has fully dropped.
# Seconds come from ~/.config/gaming-mode/start-delay.env, read on every start;
# set it with `gaming-mode-delay <seconds>` (0 = no delay).
EnvironmentFile=-%h/.config/gaming-mode/start-delay.env
ExecStartPre=/bin/sh -c 'sleep "$${GAMING_MODE_START_DELAY:-0}"'
# The stock unit allows only 5 s to start; the delay counts against it.
TimeoutStartSec=90
